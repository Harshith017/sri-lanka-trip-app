<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<title>Pulse</title>
<meta name="description" content="Calorie, macro, workout and weight tracking with calculations you can check.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0D10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#EBEDF0; --surface-3:#DFE2E7;
    --ink:#0B0D10; --ink-2:#4F5663; --ink-3:#7D8490; --line:#E1E4E9;
    --accent:#C8F03C; --on-accent:#0B0D10; --accent-ink:#4D7C0F;
    --protein:#2a78d6; --carbs:#eb6834; --fat:#1baf7a;
    --series-1:#2a78d6; --muted-mark:#A9AFB9;
    --danger:#D63B3A; --warn:#B7791F;
    --radius:22px; --shadow:0 1px 2px rgba(11,13,16,.04),0 8px 24px rgba(11,13,16,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0B0D10; --surface:#15181D; --surface-2:#1D2127; --surface-3:#282D35;
      --ink:#F3F5F8; --ink-2:#A7AEB9; --ink-3:#747C88; --line:#252A31;
      --accent-ink:#C8F03C;
      --protein:#3987e5; --carbs:#d95926; --fat:#199e70;
      --series-1:#3987e5; --muted-mark:#5A626D;
      --danger:#F06060; --warn:#E0A43A;
      --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0B0D10; --surface:#15181D; --surface-2:#1D2127; --surface-3:#282D35;
    --ink:#F3F5F8; --ink-2:#A7AEB9; --ink-3:#747C88; --line:#252A31;
    --accent-ink:#C8F03C;
    --protein:#3987e5; --carbs:#d95926; --fat:#199e70;
    --series-1:#3987e5; --muted-mark:#5A626D;
    --danger:#F06060; --warn:#E0A43A;
    --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;
  }
  button,input,select,textarea{font:inherit;color:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  #app{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom));}

  /* ---------- Header ---------- */
  .head{
    position:sticky;top:0;z-index:10;background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 0 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;}
  .datenav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .datenav button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-2);}
  .datenav button:disabled{opacity:.3;cursor:default;}
  .datenav span{font-size:13.5px;font-weight:700;min-width:84px;text-align:center;}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card h2 small{font-weight:600;color:var(--ink-3);font-size:12.5px;}
  .label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
  .muted{color:var(--ink-2);}
  .faint{color:var(--ink-3);}
  .small{font-size:13px;}
  .tiny{font-size:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .grow{flex:1;min-width:0;}
  .hr{height:1px;background:var(--line);margin:14px 0;border:0;}

  /* ---------- Hero ring ---------- */
  .hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;}
  .ring{position:relative;width:150px;height:150px;}
  .ring svg{width:150px;height:150px;transform:rotate(-90deg);}
  .ring .track{stroke:var(--surface-2);}
  .ring .bar{stroke:var(--accent-ink);transition:stroke-dashoffset .5s ease;}
  .ring .bar.over{stroke:var(--danger);}
  .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .ring-big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .ring-lbl{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
  .ring-lbl.over{color:var(--danger);}
  .stats{display:grid;gap:10px;}
  .stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .stat:last-child{border-bottom:0;padding-bottom:0;}
  .stat b{font-size:18px;font-weight:700;}
  .stat span{font-size:13px;color:var(--ink-2);font-weight:600;}
  .explain{margin-top:14px;padding:10px 12px;background:var(--surface-2);border-radius:12px;font-size:12.5px;color:var(--ink-2);}
  .explain b{color:var(--ink);}

  /* ---------- Meters ---------- */
  .meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .meter .top{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .meter .key{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
  .meter .val{font-size:18px;font-weight:800;margin:4px 0 6px;letter-spacing:-.01em;}
  .meter .val small{font-size:12.5px;font-weight:600;color:var(--ink-3);}
  .track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .track i{display:block;height:100%;border-radius:99px;}
  .meter .left{font-size:12px;color:var(--ink-3);margin-top:5px;font-weight:600;}

  /* ---------- Buttons & inputs ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;
    background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:14px;padding:12px 18px;font-size:15px;
  }
  .btn.block{width:100%;}
  .btn.ghost{background:var(--surface-2);color:var(--ink);font-weight:700;}
  .btn.line{background:none;border:1px solid var(--line);color:var(--ink);font-weight:700;}
  .btn.danger{background:none;border:1px solid var(--line);color:var(--danger);font-weight:700;}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:11px;}
  .btn:disabled{opacity:.45;cursor:default;}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:13px;}
  .icon-btn{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;flex:0 0 auto;}

  .field{display:block;margin-bottom:14px;}
  .field > span{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
  .field > em{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:5px;}
  .input,select.input{
    width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;
    padding:12px 13px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;
  }
  select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
    background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
  .input:focus{border-color:var(--ink-3);}
  .input-unit{position:relative;}
  .input-unit .input{padding-right:48px;}
  .input-unit b{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);font-weight:700;pointer-events:none;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;}
  .seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2);}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .opt{display:block;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:var(--surface);}
  .opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .opt b{display:block;font-size:14.5px;}
  .opt span{font-size:12.5px;color:var(--ink-2);}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;}
  .toggle input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--surface-3);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s;}
  .toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle input:checked{background:var(--accent-ink);}
  .toggle input:checked::after{transform:translateX(18px);}

  /* ---------- Lists ---------- */
  .list{margin:0;padding:0;list-style:none;}
  .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;}
  .item:first-child{border-top:0;}
  .item .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .s{font-size:12.5px;color:var(--ink-3);font-weight:600;}
  .item .k{font-weight:800;font-size:15px;white-space:nowrap;}
  .item .k small{font-size:12px;color:var(--ink-3);font-weight:600;}
  .badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px;}
  .meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .meal-head h3{margin:0;font-size:16px;font-weight:800;}
  .meal-head .kc{font-size:13px;font-weight:700;color:var(--ink-2);}
  .add-row{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer;color:var(--ink-2);font-weight:700;font-size:14px;}
  .empty{text-align:center;padding:26px 12px;color:var(--ink-3);font-size:14px;}

  /* ---------- Water ---------- */
  .water-bar{display:flex;gap:4px;margin:6px 0 12px;}
  .water-bar i{flex:1;height:26px;border-radius:7px;background:var(--surface-2);}
  .water-bar i.on{background:var(--series-1);}

  /* ---------- Charts ---------- */
  .chart{position:relative;}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;}
  .chart .grid line{stroke:var(--line);stroke-width:1;}
  .chart .axis text{fill:var(--ink-3);font-size:10.5px;font-weight:600;}
  .chart .raw{fill:var(--muted-mark);}
  .chart .trend{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .chart .col{fill:var(--series-1);}
  .chart .tgt{stroke:var(--ink);stroke-width:2;stroke-linecap:round;}
  .chart .cross{stroke:var(--ink-3);stroke-width:1;}
  .chart .hit{fill:transparent;cursor:crosshair;}
  .chart .end{fill:var(--series-1);stroke:var(--surface);stroke-width:2;}
  .tip{
    position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;
    padding:7px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;z-index:2;
  }
  .tip.on{opacity:1;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);font-weight:600;margin-top:8px;flex-wrap:wrap;}
  .legend i{display:inline-block;vertical-align:middle;margin-right:5px;}
  .legend .dot{width:8px;height:8px;border-radius:50%;background:var(--muted-mark);}
  .legend .ln{width:14px;height:2px;background:var(--series-1);border-radius:2px;}
  .legend .bx{width:10px;height:10px;border-radius:3px;background:var(--series-1);}
  .legend .tk{width:12px;height:2px;background:var(--ink);}
  details.table{margin-top:10px;font-size:13px;}
  details.table summary{cursor:pointer;color:var(--ink-3);font-weight:700;font-size:12.5px;}
  details.table table{width:100%;border-collapse:collapse;margin-top:8px;}
  details.table td,details.table th{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  details.table td:first-child,details.table th:first-child{text-align:left;}
  details.table th{color:var(--ink-3);font-weight:700;font-size:12px;}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .kpi{background:var(--surface-2);border-radius:14px;padding:11px 12px;}
  .kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .kpi span{font-size:11.5px;color:var(--ink-3);font-weight:700;}
  .note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:10px;}
  .note.warn{border-left:3px solid var(--warn);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 8px;background:var(--accent);color:var(--on-accent);}
  .pill.grey{background:var(--surface-2);color:var(--ink-2);}

  /* ---------- Bottom nav ---------- */
  .nav{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;
    display:flex;gap:2px;padding:6px;border-radius:24px;background:rgba(21,24,29,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25);
    width:min(528px,calc(100% - 24px));
  }
  .nav button{
    flex:1;border:0;background:none;color:#8E96A3;border-radius:18px;padding:8px 2px 7px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;
  }
  .nav button svg{width:22px;height:22px;}
  .nav button.on{background:var(--accent);color:var(--on-accent);}

  /* ---------- Sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;transition:opacity .2s;}
  .scrim.on{opacity:1;}
  .sheet{
    position:fixed;left:50%;bottom:0;z-index:41;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
    background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,100%);transition:transform .25s ease;overscroll-behavior:contain;
  }
  .sheet.on{transform:translate(-50%,0);}
  .grab{width:40px;height:5px;border-radius:99px;background:var(--surface-3);margin:0 auto 12px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
  .sheet-head h2{margin:0;font-size:20px;font-weight:800;}
  .preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 16px;}
  .preview div{background:var(--surface-2);border-radius:12px;padding:9px 10px;}
  .preview b{display:block;font-size:17px;font-weight:800;}
  .preview span{font-size:11.5px;color:var(--ink-3);font-weight:700;}
  .preview .k{background:var(--ink);color:var(--bg);}
  .preview .k span{color:inherit;opacity:.7;}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:8px;align-items:center;margin-bottom:8px;}
  .set-row .n{font-weight:800;color:var(--ink-3);text-align:center;font-size:13px;}
  .lift{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
  .estimate{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;margin:6px 0 14px;}
  .estimate b{font-size:22px;font-weight:800;}
  .estimate span{font-size:12px;opacity:.75;font-weight:600;}
  video.scan{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover;}

  /* ---------- Onboarding ---------- */
  .welcome{padding:calc(36px + env(safe-area-inset-top)) 4px 8px;}
  .welcome .mark{width:56px;height:56px;border-radius:16px;display:block;margin-bottom:18px;}
  .welcome h1{font-size:34px;line-height:1.1;margin:0 0 10px;font-weight:800;letter-spacing:-.03em;}
  .welcome p{margin:0 0 20px;color:var(--ink-2);}

  .toast{
    position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;
    opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}
  .spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--ink);animation:sp .8s linear infinite;margin:18px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .math{font-size:13px;}
  .math .r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:10px;}
  .math .r:last-child{border-bottom:0;}
  .math .r.tot{font-weight:800;}
  @media (max-width:380px){
    .hero{grid-template-columns:1fr;justify-items:center;}
    .hero .stats{width:100%;}
    .meters{grid-template-columns:1fr;}
    .kpis{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" hidden></nav>
<div class="toast" id="toast"></div>
<script src="calc.js"></script>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
