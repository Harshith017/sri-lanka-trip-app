<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Project W</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F5C4A">
<meta name="apple-mobile-web-app-title" content="Project W">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1E4; --paper-2:#E3E7D6; --ink:#17241F; --ink-soft:#4C5A52;
    --jungle:#1F5C4A; --jungle-2:#164436; --brass:#C68A2E; --brass-soft:#F3E3C2;
    --clay:#B8503F; --leaf:#5C8A4E; --leaf-soft:#DCE9D4;
    --card:#FBFAF4; --line:#D9DCC9; --accent:#1F5C4A;
    --shadow:0 10px 24px rgba(23,36,31,.10);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#131E1A; --paper-2:#0F1815; --ink:#EDEFE6; --ink-soft:#AAB6AD;
      --jungle:#4C9078; --jungle-2:#3A7360; --brass:#E0AC4E; --brass-soft:#3A311C;
      --clay:#E17E6B; --leaf:#8FC17B; --leaf-soft:#1F2E1C;
      --card:#1B2925; --line:#2B3B34; --accent:#E0AC4E;
      --shadow:0 10px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
  button{font-family:inherit;}

  #app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--paper);}

  /* ---------- Boot / join ---------- */
  .boot{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;padding:28px 24px;text-align:center;gap:6px;
  }
  .boot .flag{font-size:42px;}
  .logo{width:88px;height:88px;border-radius:24px;object-fit:cover;box-shadow:0 8px 22px rgba(0,0,0,.25);}
  .logo-lock{position:relative;display:inline-block;}
  .logo-lock span{position:absolute;right:-8px;bottom:-6px;font-size:22px;}
  .logo-sm{width:30px;height:30px;border-radius:9px;object-fit:cover;vertical-align:-5px;margin-right:9px;border:1.5px solid rgba(255,255,255,.5);}
  .boot h2{margin:6px 0 2px;font-size:24px;font-weight:600;}
  .boot p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5;max-width:330px;}
  .spinner{
    width:26px;height:26px;border-radius:50%;margin:14px auto;
    border:3px solid var(--line);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .join-card{
    width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px;margin-top:18px;text-align:left;
  }
  .join-email{
    font-size:12.5px;color:var(--ink-soft);background:var(--paper-2);
    border-radius:9px;padding:8px 11px;margin-bottom:14px;word-break:break-all;
    display:flex;align-items:center;gap:8px;
  }
  .join-email img{width:20px;height:20px;border-radius:50%;flex:0 0 auto;}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:12px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:14.5px;font-weight:600;
    cursor:pointer;
  }
  .google-btn img{width:18px;height:18px;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;padding:14px 18px 12px;
    background:linear-gradient(160deg,var(--jungle),var(--jungle-2));
    color:#F6F4E9;border-radius:0 0 22px 22px;box-shadow:var(--shadow);
  }
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .trip-title{font-size:22px;font-weight:600;margin:0;}
  .trip-dates{font-size:12.5px;opacity:.85;white-space:nowrap;}
  .route-line{margin-top:6px;font-size:12.5px;opacity:.9;white-space:nowrap;overflow-x:auto;scrollbar-width:none;}
  .route-line::-webkit-scrollbar{display:none;}
  .whoami{
    margin-top:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;
    background:rgba(255,255,255,.12);border-radius:999px;padding:6px 8px 6px 13px;font-size:12.5px;
  }
  .whoami .me{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .whoami .me img{width:18px;height:18px;border-radius:50%;}
  .whoami button{
    border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto;
  }
  .sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8FC17B;margin-right:6px;}
  .sync-dot.busy{background:var(--brass);}
  .sync-dot.err{background:#E17E6B;}
  .sync-dot.offline{background:var(--ink-soft);}

  .offline-banner{
    display:none;align-items:center;gap:8px;justify-content:center;
    background:var(--brass);color:#211705;font-size:12.5px;font-weight:600;
    padding:8px 14px;text-align:center;
  }

  main{flex:1;overflow-y:auto;padding:16px 16px 96px;}
  .section-label{font-size:13px;font-weight:700;color:var(--ink-soft);margin:18px 2px 8px;}
  .section-label:first-child{margin-top:4px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
  .muted{color:var(--ink-soft);}
  .empty{text-align:center;padding:38px 20px;color:var(--ink-soft);font-size:14px;}
  .empty .big{font-size:30px;display:block;margin-bottom:8px;}

  /* ---------- Now ---------- */
  .now-hero{padding:20px 18px;}
  .now-hero-lbl{font-size:12px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .now-hero-sub{font-size:14.5px;margin-top:4px;color:var(--ink);}
  .now-hero-time{font-size:12.5px;color:var(--accent);font-weight:700;margin-top:4px;}
  .now-hero-big{font-family:'Fraunces',serif;font-size:44px;font-weight:600;line-height:1.1;margin-top:2px;}
  .now-hero-unit{font-size:18px;font-weight:500;color:var(--ink-soft);margin-left:6px;}
  .now-hero-foot{font-size:12px;color:var(--ink-soft);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
  .now-chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
  .now-chip{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;}
  .now-chip .nc-k{font-size:11px;color:var(--ink-soft);}
  .now-chip .nc-v{font-size:16px;font-weight:700;margin-top:2px;}
  .now-chip .nc-v.pos{color:var(--leaf);} .now-chip .nc-v.neg{color:var(--clay);}
  .item-row.now-done{opacity:.4;}
  .item-row.now-next{background:var(--leaf-soft);border-radius:8px;margin:0 -8px;padding:7px 8px;border-top:none;}
  .now-badge{display:inline-block;font-size:9.5px;font-weight:700;color:var(--jungle);background:var(--brass-soft);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:.03em;}

  /* ---------- Itinerary ---------- */
  .ref-scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px 4px;}
  .ref-chip{flex:0 0 auto;background:var(--brass-soft);border-radius:12px;padding:8px 12px;min-width:118px;}
  .ref-chip .k{font-size:11px;color:var(--ink-soft);}
  .ref-chip .v{font-size:13.5px;font-weight:700;margin-top:2px;}
  .day-card{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--card);}
  .day-head{width:100%;text-align:left;border:none;background:transparent;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);}
  .day-num{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--accent);background:var(--leaf-soft);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .day-meta{flex:1;min-width:0;}
  .day-meta .d1{font-weight:700;font-size:14.5px;}
  .day-meta .d2{font-size:12px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-chev{transition:transform .2s ease;color:var(--ink-soft);}
  .day-card.open .day-chev{transform:rotate(180deg);}
  .day-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .day-card.open .day-body{max-height:1200px;}
  .day-body-in{padding:0 16px 14px;}
  .item-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px dashed var(--line);}
  .map-pin{flex:0 0 auto;text-decoration:none;font-size:14px;opacity:.55;padding:2px 4px;border-radius:6px;margin-left:auto;}
  .map-pin:active{opacity:1;background:var(--leaf-soft);}
  .now-hero-sub .map-pin{opacity:.7;font-size:15px;}
  .d2 .map-pin{opacity:.7;margin-left:4px;}
  .item-row:first-child{border-top:none;}
  .item-time{flex:0 0 74px;font-size:11.5px;color:var(--accent);font-weight:700;padding-top:1px;}
  .item-text{font-size:13.5px;line-height:1.4;}
  .day-tip{margin-top:8px;background:var(--brass-soft);border-radius:10px;padding:8px 10px;font-size:12.5px;font-style:italic;}

  /* ---------- Balances ---------- */
  .balance-hero{text-align:center;padding:22px 10px 18px;}
  .balance-hero .amt{font-family:'Fraunces',serif;font-size:38px;font-weight:600;}
  .balance-hero .lbl{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .pos{color:var(--leaf);} .neg{color:var(--clay);}
  .person-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);}
  .person-row:first-child{border-top:none;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--jungle);color:#F6F4E9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .p-name{flex:1;font-weight:600;font-size:14.5px;min-width:0;}
  .p-name .you-tag{font-size:10.5px;color:var(--brass);font-weight:700;margin-left:6px;}
  .p-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-amt{font-weight:700;font-size:14.5px;}

  /* ---------- Bills ---------- */
  .bill-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;}
  .bill-row:first-child{border-top:none;}
  .bill-icon{width:36px;height:36px;border-radius:10px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .bill-mid{flex:1;min-width:0;}
  .bill-desc{font-weight:600;font-size:14px;}
  .bill-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .bill-amt{font-weight:700;font-size:14.5px;white-space:nowrap;}

  /* ---------- Settle ---------- */
  .settle-row{padding:13px 4px;border-top:1px solid var(--line);}
  .settle-row:first-child{border-top:none;}
  .settle-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;}
  .settle-arrow{color:var(--brass);}
  .settle-amt{font-family:'Fraunces',serif;font-size:19px;margin-top:4px;}
  .settle-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .hist-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);font-size:13px;}
  .hist-row:first-child{border-top:none;}

  /* ---------- Buttons ---------- */
  .btn{border:none;border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-brand{background:var(--jungle);color:#F6F4E9;}
  .btn-ghost{background:var(--paper-2);color:var(--ink);}
  .btn-line{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .btn-sm{padding:7px 12px;font-size:12px;}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn-wide{width:100%;justify-content:center;}

  /* ---------- Nav ---------- */
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;
    background:var(--card);border-top:1px solid var(--line);padding:8px 6px;
    display:flex;justify-content:space-around;box-shadow:0 -6px 18px rgba(0,0,0,.06);
  }
  .tab-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:12px;cursor:pointer;}
  .tab-btn .ic{font-size:19px;line-height:1;}
  .tab-btn.active{color:var(--accent);}
  .fab{
    position:fixed;right:18px;bottom:78px;z-index:29;width:54px;height:54px;border-radius:50%;
    border:none;background:var(--brass);color:#211705;font-size:26px;font-weight:700;
    box-shadow:0 10px 20px rgba(198,138,46,.4);cursor:pointer;
  }
  @media (min-width:560px){ .fab{right:calc(50% - 260px + 18px);} }

  /* ---------- Sheets ---------- */
  .sheet-scrim{position:fixed;inset:0;background:rgba(15,20,17,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .sheet-scrim.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;
    background:var(--paper);border-radius:20px 20px 0 0;padding:16px 18px 22px;
    transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow-y:auto;
    box-shadow:0 -10px 30px rgba(0,0,0,.25);
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:44px;height:5px;background:var(--line);border-radius:99px;margin:0 auto 12px;}
  .sheet-x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:var(--paper-2);color:var(--ink-soft);font-size:15px;cursor:pointer;z-index:2;}
  .hdr-gear{background:rgba(255,255,255,.16);border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto;align-self:center;}
  .sheet h3{margin:0 0 14px;font-size:19px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:16px;font-family:inherit;
  }
  .amount-field{position:relative;}
  .amount-field .rupee{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-weight:600;}
  .amount-field input{padding-left:34px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .chip.on{background:var(--jungle);border-color:var(--jungle);color:#F6F4E9;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .sheet-actions .btn{flex:1;justify-content:center;}
  .split-hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .split-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .scan-cta{padding:13px 16px;font-size:14.5px;margin-bottom:12px;}
  .rc-photo{display:block;max-height:220px;max-width:100%;margin:0 auto;border-radius:10px;object-fit:contain;cursor:zoom-in;transition:max-height .2s;}
  .rc-photo.big{max-height:none;cursor:zoom-out;}
  .rc-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .rc-kind{flex:0 0 86px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 4px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .rc-desc{flex:1;min-width:0;}
  .rc-amt{flex:0 0 92px;width:92px;text-align:right;}
  .rc-item .rc-kind{background:var(--jungle);border-color:var(--jungle);color:#F6F4E9;}
  .rc-charge .rc-kind{background:var(--brass-soft);border-color:var(--brass);}
  .rc-discount .rc-kind{background:var(--leaf-soft);border-color:var(--leaf);}
  .rc-ignore{opacity:.45;}
  .rc-warn .rc-amt{border-color:var(--clay);box-shadow:0 0 0 1px var(--clay);}
  .rc-warn-note{font-size:11.5px;color:var(--clay);margin:-2px 0 8px 92px;}
  .rc-toggle{background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 0 8px;font-family:inherit;}
  .rc-kind-total{display:flex;align-items:center;justify-content:center;background:var(--paper-2);text-align:center;}
  .rc-total .rc-amt{font-weight:700;border-color:var(--brass);}
  .rc-ignore .rc-desc,.rc-ignore .rc-amt{text-decoration:line-through;}
  .extras-box{background:var(--paper-2);border-radius:12px;padding:10px 12px;margin:6px 0 8px;}
  .extras-head{font-size:13px;font-weight:700;}
  .x-row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px;}
  .x-kind{padding:6px 9px;font-size:11.5px;white-space:nowrap;}
  .x-kind.disc{background:var(--leaf-soft);border-color:var(--leaf);}
  .breakdown{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0 10px;font-size:13px;}
  .breakdown:empty{display:none;}
  .bd-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;}
  .bd-total{font-weight:700;border-top:1px dashed var(--line);margin-top:3px;padding-top:6px;}
  .bd-head{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px;}
  .bd-check{font-size:12.5px;font-weight:600;margin-top:6px;padding:6px 8px;border-radius:8px;}
  .bd-check.ok{background:var(--leaf-soft);color:var(--leaf);}
  .bd-check.bad{background:var(--brass-soft);color:var(--ink);}
  .req-card{border-color:var(--brass);background:var(--brass-soft);}
  .req-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);}
  .req-row:first-of-type{border-top:none;}
  .req-row .p-name{min-width:0;overflow:hidden;}
  .tab-btn{position:relative;}
  .tab-badge{position:absolute;top:0;right:6px;min-width:17px;height:17px;border-radius:99px;background:var(--clay);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .invite-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);border-radius:12px;padding:10px 12px;}
  .invite-code{font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:700;letter-spacing:.12em;}
  .fx-box{background:var(--paper-2);border-radius:12px;padding:10px 12px;margin:-4px 0 14px;}
  .fx-line{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;}
  .trip-dates{background:rgba(255,255,255,.14);border:none;color:#F6F4E9;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px;}
  .plan-dates{font-weight:700;font-size:14.5px;}
  .bud-card{padding:16px;}
  .bud-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;}
  .bud-big{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:2px;}
  .bud-left{text-align:right;font-weight:700;font-size:15px;line-height:1.15;}
  .bud-left span{font-size:11px;font-weight:600;opacity:.8;}
  .bbar{height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:5px;}
  .bfill{height:100%;border-radius:99px;background:var(--leaf);}
  .bfill.over{background:var(--clay);}
  .bud-row{padding:7px 0;border-top:1px dashed var(--line);}
  .bud-row:first-of-type{border-top:none;}
  .bud-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;}
  input[type=date]{min-height:44px;}
  .split-input{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit;}

  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
    font-size:13px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;
    pointer-events:none;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--clay);color:#fff;}

  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
